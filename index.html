<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#EEECE9">
    <meta name="description" content="Дуа из Корана и мольбы Пророка ﷺ">
    <title>Дуа — поминание и мольбы</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="На главную" id="home-link">
          <img class="brand-logo" src="logo.jpg" alt="">
          <span>ДУА</span>
        </a>
        <div class="topbar-tools">
          <button class="notes-button" id="notes-button" type="button" aria-label="Свои заметки" title="Свои заметки">
            <svg class="bookmark-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-4-6 4V4.5Z"></path></svg>
            <span class="notes-count" id="notes-count" hidden></span>
          </button>
          <div class="theme-switch" role="group" aria-label="Тема оформления">
            <button class="theme-button is-active" type="button" data-theme-choice="light" aria-label="Светлая тема" title="Светлая тема">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path></svg>
            </button>
            <button class="theme-button" type="button" data-theme-choice="dark" aria-label="Ночная тема" title="Ночная тема">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 15.2A8.5 8.5 0 0 1 8.8 3.6 8.6 8.6 0 1 0 20.4 15.2Z"></path><path d="m16.5 4 .5 1.5 1.5.5-1.5.5-.5 1.5L16 6.5l-1.5-.5 1.5-.5.5-1.5Z"></path></svg>
            </button>
          </div>
        </div>
      </header>

      <main id="main-content">
        <section class="home-view" id="home-view" aria-labelledby="home-title">
          <div class="home-intro">
            <h1 id="home-title">СБОРНИК ДУА</h1>
            <span class="intro-rule" aria-hidden="true"></span>
          </div>
          <div class="collection-list" aria-label="Выберите сборник">
            <button class="collection-option" type="button" data-collection="prophet">
              <span class="collection-index">01</span>
              <span class="collection-copy"><span class="collection-title">Дуа Пророка ﷺ</span><span class="collection-caption">Мольбы из Сунны Посланника ﷺ</span></span>
              <span class="collection-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"></path></svg></span>
            </button>
            <button class="collection-option" type="button" data-collection="quran">
              <span class="collection-index">02</span>
              <span class="collection-copy"><span class="collection-title">Дуа из Корана</span><span class="collection-caption">Мольбы, ниспосланные в Книге Аллаха</span></span>
              <span class="collection-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M8 7h9v9"></path></svg></span>
            </button>
          </div>
        </section>

        <section class="reading-view" id="reading-view" aria-live="polite" hidden>
          <div class="reading-heading">
            <button class="back-button" id="back-button" type="button"><span aria-hidden="true">←</span> Назад</button>
            <span class="eyebrow" id="collection-label"></span>
          </div>
          <article class="dua-entry" id="dua-entry"></article>
        </section>

        <section class="notes-view" id="notes-view" aria-labelledby="notes-title" hidden>
          <div class="notes-heading">
            <button class="back-button" id="notes-back-button" type="button"><span aria-hidden="true">←</span> Назад</button>
            <h1 id="notes-title">Свои заметки</h1>
          </div>
          <p class="notes-empty" id="notes-empty" hidden>Пока нет сохранённых дуа.</p>
          <div class="saved-notes-list" id="saved-notes-list"></div>
        </section>
      </main>

      <nav class="dua-navigation" id="dua-navigation" aria-label="Навигация по дуа" hidden>
        <button class="nav-arrow" id="previous-dua" type="button" aria-label="Предыдущее дуа" title="Предыдущее дуа">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
        </button>
        <div class="nav-progress">
          <span class="nav-count"><span id="current-number">1</span><span class="count-divider">/</span><span id="total-number">1</span></span>
          <span class="progress-track"><span class="progress-fill" id="progress-fill"></span></span>
        </div>
        <button class="nav-arrow" id="next-dua" type="button" aria-label="Следующее дуа" title="Следующее дуа">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
        </button>
      </nav>
    </div>

    <dialog class="supplement-dialog" id="supplement-dialog" aria-labelledby="supplement-dialog-title">
      <div class="dialog-header">
        <h2 id="supplement-dialog-title">Дополнение</h2>
        <button class="dialog-close" id="supplement-dialog-close" type="button" aria-label="Закрыть" title="Закрыть">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"></path></svg>
        </button>
      </div>
      <div class="dialog-content" id="supplement-dialog-content"></div>
    </dialog>
  </body>
</html>
